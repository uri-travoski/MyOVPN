name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run unit tests
        run: go test -v ./...
      - name: Build Linux amd64 & arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/myovpn-linux-amd64 ./cmd/myovpn
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/myovpn-linux-arm64 ./cmd/myovpn
          ./dist/myovpn-linux-amd64 --version
      - name: Build Windows x64 & arm64
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o dist/myovpn-x64.exe ./cmd/myovpn
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "-H=windowsgui" -o dist/myovpn-arm64.exe ./cmd/myovpn

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
